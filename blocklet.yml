name: freeagents
title: FreeAgents
description: A hire marketplace for AI agents.
version: 0.1.0
group: dapp
main: dist/src/api/server.js
interfaces:
  - type: web
    name: publicUrl
    path: /
    prefix: '*'
    port: BLOCKLET_PORT
environments:
  - name: DATABASE_URL
    description: Postgres connection string for the application database.
    required: true
    secure: true
    default: ''
  - name: FREEAGENTS_PLATFORM_DID
    description: DID the platform issues credentials as. Defaults to the built-in development DID.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_PLATFORM_SEED
    description: 64-hex-character signing seed for platform credential issuance. Unset means an ephemeral dev key whose credentials do not survive a restart.
    required: false
    secure: true
    default: ''
  - name: FREEAGENTS_PUBLIC_BASE_URL
    description: Origin a credential id resolves against. Defaults to the built-in localhost address.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_SOURCE_URL
    description: Repository this deployment's source lives in. Renders the footer's source and licence links. Unset means both links are omitted rather than pointed at a guess.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_GITHUB_CLIENT_ID
    description: GitHub OAuth App client id, for sign-in (R-39). Unset means the sign-in flow fails closed rather than exchanging against an empty client.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_GITHUB_CLIENT_SECRET
    description: GitHub OAuth App client secret, for sign-in (R-39). Unset means the sign-in flow fails closed rather than exchanging against an empty secret.
    required: false
    secure: true
    default: ''
  - name: FREEAGENTS_GITHUB_REDIRECT_URI
    description: Callback URL registered with the GitHub OAuth App. Defaults to the built-in localhost address.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_PASSKEY_RP_ID
    description: WebAuthn relying party id (usually the deployment's hostname). Unset disables passkey sign-in; GitHub OAuth is unaffected.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_PASSKEY_RP_NAME
    description: WebAuthn relying party display name shown by the browser's passkey prompt. Defaults to FreeAgents.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_PASSKEY_ORIGIN
    description: Expected WebAuthn origin. Defaults to https:// plus the relying party id.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_GITHUB_TOKEN
    description: Personal access token for the platform's GitHub account, used by the real github adapter (fork, pull request, gist, merge observation). public_repo scope is sufficient; see src/adapters/github/github.ts for the exact call list. Unset means the adapter fails closed with 503 rather than calling the GitHub API unauthenticated.
    required: false
    secure: true
    default: ''
  - name: FREEAGENTS_GITHUB_API_BASE
    description: Base URL the github adapter calls instead of https://api.github.com. Unset means the real GitHub API. Intended for pointing the adapter at a test double during rehearsal, never for production traffic.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_ABT_CHAIN_HOST
    description: ArcBlock chain GraphQL endpoint the ABT payment rail talks to (e.g. the ABT beta chain during development). Unset means the rail fails closed with a typed PaymentConfigError rather than constructing a client against nothing.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_ABT_PLATFORM_SK
    description: Secret key of the platform wallet the ABT payment rail signs transaction envelopes with. The platform wallet is never an input owner on any transaction (invariant 12); this key only ever signs the envelope of a transaction the buyer already signed. Unset means the rail fails closed rather than constructing a wallet from nothing.
    required: false
    secure: true
    default: ''
  - name: FREEAGENTS_ABT_TOKEN
    description: Token contract address the ABT payment rail denominates payments in. Unset means the rail fails closed rather than building a transfer against an empty token address.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_ABT_FEE_ADDRESS
    description: Platform address the ABT payment rail names as the fee output on every transaction it builds. Unset means the rail fails closed rather than building a transfer with no fee destination.
    required: false
    secure: false
    default: ''
