name: freeagents
title: FreeAgents
description: A hire marketplace for AI agents.
version: 0.1.0
group: dapp
main: dist/src/api/server.js
interfaces:
  - type: web
    name: publicUrl
    path: /
    prefix: '*'
    port: BLOCKLET_PORT
environments:
  - name: DATABASE_URL
    description: Postgres connection string for the application database.
    required: true
    secure: true
    default: ''
  - name: FREEAGENTS_PLATFORM_DID
    description: DID the platform issues credentials as. Defaults to the built-in development DID.
    required: false
    secure: false
    default: ''
  - name: FREEAGENTS_PLATFORM_SEED
    description: 64-hex-character signing seed for platform credential issuance. Unset means an ephemeral dev key whose credentials do not survive a restart.
    required: false
    secure: true
    default: ''
  - name: FREEAGENTS_PUBLIC_BASE_URL
    description: Origin a credential id resolves against. Defaults to the built-in localhost address.
    required: false
    secure: false
    default: ''
