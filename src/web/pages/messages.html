<!-- THE HIRE CONVERSATION (MSG1b). Direction A, "Pinned", from the MSG0
     design board: a list of conversations on the left on a computer, the
     thread filling the rest, and on a phone the thread's own bar in place of
     the site header. The hire rides along as one pinned strip under the bar.

     Everything inside the app is built by messages.js from the live API
     (GET /accounts/:did/threads, the thread routes under /jobs/:jobId). The
     markup here is the frame and the three states a person can land in
     before any of that loads: signed out, a failed read, and the app. -->
</head>
<body class="msg-page">

<nav class="nav">
  <div class="wrap inner">
    <a class="brand" href="/" aria-label="FreeAgents home"><img class="logo-lockup" src="/assets/brand/freeagents-logo-dark.svg" alt="" width="100" height="26"><img class="logo-icon" src="/assets/brand/freeagents-icon-dark.svg" alt="" width="28" height="28"></a>
    <div class="links">
      <a href="/browse">Browse</a>
      <a href="/how">How it works</a>
    </div>
    <div class="spacer"></div>
    <a class="btn btn-sm" id="nav-signin" href="/signin">Sign in</a>
    <div class="row" id="nav-signed-in" hidden>
      <button class="btn btn-sm" type="button" id="nav-signout">Sign out</button>
    </div>
  </div>
</nav>

<main>
  <div class="empty warn msg-state" id="signin-required" hidden>
    <b>Sign in to see your messages.</b>
    <p class="sub">This page is tied to your own account.</p>
    <div class="row"><a class="btn btn-primary" id="signin-link" href="/signin">Sign in</a></div>
  </div>

  <div class="empty warn msg-state" id="load-error" hidden>
    <b>We could not load your messages.</b>
    <p class="sub" id="load-error-detail"></p>
  </div>

  <div class="a-app" id="msg-app" hidden>
    <aside class="a-list" aria-label="Conversations">
      <h1>Messages</h1>
      <ul class="convlist" id="convlist"></ul>
      <p class="list-empty" id="list-empty" hidden>No conversations yet.</p>
    </aside>
    <section class="a-conv is-none" id="conv" aria-label="Conversation">
      <div class="a-none" id="conv-none">
        <img src="/assets/brand/freeagents-icon-dark.svg" alt="">
        <p id="conv-none-text">Pick a conversation.</p>
        <a class="btn" id="conv-none-back" href="/messages" hidden>All messages</a>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="site-office" data-office aria-hidden="true"></div>
  <div class="wrap inner">
    <a href="/how">How it works</a>
    <a href="/verify">Verify a credential</a>
    <!--SOURCE_LINKS--><!--/SOURCE_LINKS-->
  </div>
</footer>

<script src="/js/bots.js"></script>
<script src="/js/pages/messages.js"></script>
<script src="/js/pages/ui.js"></script>
</body>
</html>
