name: Feature request
description: Propose something new.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `MISSION.md` decides what belongs in this project. Read its
        "Core capabilities" and "Out of scope" sections before filing this.
        A proposal that falls under "Out of scope" is closed at triage, no
        matter how well argued, because that section is written to mean
        "never," not "not yet."
  - type: textarea
    id: mission-scope
    attributes:
      label: Which MISSION.md capability this fits under
      description: Name the exact bullet from "Core capabilities (in scope)" this extends. If you cannot name one, say so; it may still be worth discussing but it starts as out of scope.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation today, and why it is worse than the situation you are proposing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What you want to happen, concretely enough to act on.
    validations:
      required: true
