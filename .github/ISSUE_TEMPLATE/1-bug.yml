name: Bug report
description: Report something that is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the problem.
      placeholder: |
        1. Call POST /jobs with ...
        2. Confirm the acceptance criteria
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you thought would happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste the response body or error if you have it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA or release you were running against.
      placeholder: e.g. a2f5167
    validations:
      required: true
